name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Unit tests + coverage thresholds (src/core)
        run: npm run test:coverage
      - name: Build (typecheck gates the build)
        run: npm run build
      - name: Bundle-size budget
        run: npm run check:budget
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Browser gates — behavior + axe a11y, both themes, chromium/firefox/webkit + mobile
        run: npm run test:a11y
        env:
          ALL_BROWSERS: '1'
