name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The gate, called rather than copied -- the same file the Dependabot
  # auto-merge waits on, so what merges a bump and what publishes it are
  # one definition and cannot drift apart.
  gate:
    uses: ./.github/workflows/gate.yml

  build:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (typecheck gates the build)
        run: npm run build
      # All four engines, not Chromium alone. The firefox and webkit projects in
      # playwright.config.ts are behind ALL_BROWSERS, and until now only ci.yml
      # set it -- which runs on pull_request. So a push to main, and the deploy
      # dispatched after a Dependabot merge, were gated on Chromium and mobile
      # Chromium only, and nothing in the publishing path ever ran the two
      # engines whose WebCrypto throughput differs most from Chromium's. This
      # lab's own config notes that difference as ~4x.
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: [gate, build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
